<!DOCTYPE html>
<html>
<head>
<style>
body{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
  background:white;
}
.heart{
  width:280px;
  height:280px;
  background:#a05a2c;
  position:relative;
  transform:rotate(-45deg);
  animation: beat 1s infinite;
}
.heart:before, .heart:after{
  content:"";
  width:280px;
  height:280px;
  border-radius:50%;
  background:#a05a2c;
  position:absolute;
}
.heart:before{ top:-140px; left:0; }
.heart:after{ left:140px; top:0; }

/* ITO YUNG AYOS NA GITNA AT TUWID */
.heart p{
  position:absolute;
  top:38%;
  left:63%;
  transform: translate(-50%, -50%) rotate(45deg);
  color:white;
  font-size:26px;
  font-weight:bold;
  text-align:center;
  margin:0;
  width:250px;
  line-height:1.2;
  z-index:10;
}

@keyframes beat{
  0%,100%{ transform:rotate(-45deg) scale(1) }
  50%{ transform:rotate(-45deg) scale(1.1) }
}
</style>
</head>
<body>
  <div class="heart">
    <p>I LOVE YOU<br>MOST BABE<br>😘❤️</p> <img src="babe.jpg"class=photo">
   
  </div>
</body>
</html>
